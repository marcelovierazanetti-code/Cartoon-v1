name: Build Cartoon V1

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Extrair projeto Cartoon V1
        run: |
          set -e
          rm -rf bootstrap
          mkdir -p bootstrap
          unzip -q Cartoon-V1-GitHub.zip -d bootstrap
          echo "Conteúdo extraído:"
          find bootstrap -maxdepth 3 -type f | sort | head -100

      - name: Localizar projeto Android
        id: project
        run: |
          set -e
          PROJECT_DIR="$(dirname "$(find bootstrap -name settings.gradle -o -name settings.gradle.kts | head -1)")"
          if [ -z "$PROJECT_DIR" ] || [ "$PROJECT_DIR" = "." ]; then
            echo "Não foi possível localizar settings.gradle dentro do ZIP."
            exit 1
          fi
          echo "Projeto encontrado em: $PROJECT_DIR"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar Android SDK 35
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Compilar Cartoon V1
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: |
          set -e
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew :app:assembleDebug --no-daemon --stacktrace
          else
            gradle :app:assembleDebug --no-daemon --stacktrace
          fi

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Cartoon-V1-APK
          path: ${{ steps.project.outputs.project_dir }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
